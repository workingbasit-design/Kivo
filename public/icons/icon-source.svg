<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- EveryJob layered app icon — "Icon Composer" style. One design feeds
       every platform size (192/512 PNG, maskable, apple-touch-icon, favicon).
       Layers, back to front:
         1. charcoal squircle base (subtle vertical depth gradient)
         2. glass cover sheet (translucent white, top-lit)
         3. lime E: darker offset depth layer + bright gradient face
         4. specular streak + top edge light (the Liquid Glass highlight)
       Original artwork, not an Apple asset. -->
  <defs>
    <linearGradient id="ej-base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#252527"/>
      <stop offset="0.55" stop-color="#171718"/>
      <stop offset="1" stop-color="#121213"/>
    </linearGradient>
    <linearGradient id="ej-glass" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="0.8" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ej-spec" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ej-lime" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9fb6d"/>
      <stop offset="1" stop-color="#b9e838"/>
    </linearGradient>
    <clipPath id="ej-clip">
      <rect x="32" y="32" width="960" height="960" rx="256"/>
    </clipPath>
  </defs>
  <g clip-path="url(#ej-clip)">
    <rect x="32" y="32" width="960" height="960" rx="256" fill="url(#ej-base)"/>
    <rect x="32" y="32" width="960" height="960" fill="url(#ej-glass)"/>
    <g stroke="#87ad2b" stroke-width="112" stroke-linecap="round" fill="none" transform="translate(0,22)">
      <line x1="384" y1="288" x2="384" y2="736"/>
      <line x1="384" y1="288" x2="704" y2="288"/>
      <line x1="384" y1="512" x2="640" y2="512"/>
      <line x1="384" y1="736" x2="704" y2="736"/>
    </g>
    <g stroke="url(#ej-lime)" stroke-width="112" stroke-linecap="round" fill="none">
      <line x1="384" y1="288" x2="384" y2="736"/>
      <line x1="384" y1="288" x2="704" y2="288"/>
      <line x1="384" y1="512" x2="640" y2="512"/>
      <line x1="384" y1="736" x2="704" y2="736"/>
    </g>
    <g transform="translate(300,0) skewX(-18)">
      <rect x="-160" y="-120" width="320" height="1300" fill="url(#ej-spec)" opacity="0.5"/>
    </g>
    <rect x="32" y="32" width="960" height="12" fill="#ffffff" opacity="0.16"/>
  </g>
</svg>
