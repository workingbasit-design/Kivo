name: perf (P4-P-001, record-only)

# Lighthouse on staging: records LCP/CLS, flags regressions, never blocks.
# Runs on manual dispatch and weekly — NOT on every push (noisy on shared runners).

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1' # Mondays 09:00 UTC

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://kivo-nine-silk.vercel.app/
            https://kivo-nine-silk.vercel.app/directory
            https://kivo-nine-silk.vercel.app/directory/pro/Maple-Leaf-Plumbing
            https://kivo-nine-silk.vercel.app/login
          uploadArtifacts: true
          temporaryPublicStorage: true
          runs: 3

      - name: Flag slow pages (non-blocking)
        run: |
          echo "Lighthouse complete. Review the report artifacts."
          echo "Flag: LCP > 2.5s or CLS > 0.1 on any page -> file a P2 in docs/BUGS.md."
