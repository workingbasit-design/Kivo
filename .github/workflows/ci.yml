name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: node --experimental-strip-types scripts/check-i18n-parity.mjs
      - run: node scripts/check-copy-lint.mjs
      - run: npm test
      # P4-A-001: auth matrix drift — new routes/actions must be reviewed.
      - run: node tests/scripts/gen-auth-matrix.mjs --check
      # P4: no .only/.skip committed.
      - run: |
          HITS=$(grep -rn '\.only(\|\.skip(' tests/ src/lib/__tests__/ --include='*.ts' --include='*.mts' || true)
          if [ -n "$HITS" ]; then echo "Committed .only/.skip:"; echo "$HITS"; exit 1; fi
      # B5.1: raw SQL must stay parameterized. Only the string-interpolating
      # Unsafe variants ($queryRawUnsafe/$executeRawUnsafe) are banned outside
      # __tests__; the tagged-template $queryRaw/$executeRaw forms pass values
      # as parameters and are safe. The health check is allowlisted anyway.
      - run: |
          ALLOW="src/app/api/health/route.ts"
          HITS=$(grep -rn '\$queryRawUnsafe\|\$executeRawUnsafe' src/ --include='*.ts' --include='*.tsx' | grep -v __tests__ | grep -v "$ALLOW" || true)
          if [ -n "$HITS" ]; then echo "Unallowlisted raw SQL:"; echo "$HITS"; exit 1; fi
      - run: npm run build

  # P4: dependency audit — fail on high or critical.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high

  # P4-D: database tests against an isolated Postgres (never production).
  db-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: kivo_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/kivo_test
      DATABASE_URL: postgresql://test:test@localhost:5432/kivo_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      # Fail-closed: test:db throws if TEST_DATABASE_URL is unset; skips are not allowed.
      - run: npm run test:db

  # P4-E/P4-A/P4-X/P4-B/P4-AX/P4-P: Playwright on all three device projects.
  # Sharded by project (one job per device) so each gets a dedicated runner —
  # the full 1359-test matrix on a single runner was timing out / OOM-killed.
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [iphone, android, desktop]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: kivo_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/kivo_test
      E2E_BASE_URL: http://127.0.0.1:3100
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npx playwright install --with-deps chromium firefox webkit
      # Seed: two businesses, roles, consumers (isolated test DB only).
      - run: node tests/scripts/seed-e2e.mjs
      - run: npm run build
      # Playwright's webServer starts `npm run start:e2e` and waits for :3100.
      # One project per job (matrix) for reliability.
      - run: npx playwright test --project=${{ matrix.project }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-traces-${{ matrix.project }}
          path: test-results/
          retention-days: 14
